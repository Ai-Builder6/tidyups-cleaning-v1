    <script>
      // Suppress Vite HMR WebSocket notices and stub HMR transport in proxied cloud preview
      (function() {
        try {
          var RealWS = window.WebSocket;
          if (RealWS) {
            function createMockViteSocket(url, protocols) {
              var target = new EventTarget();
              var state = 1; // WebSocket.OPEN
              var mock = Object.create(RealWS.prototype, {
                url: { value: String(url || ""), writable: true, configurable: true },
                protocol: { value: typeof protocols === "string" ? protocols : "vite-hmr", writable: true, configurable: true },
                readyState: { get: function() { return state; }, configurable: true },
                bufferedAmount: { value: 0, writable: true, configurable: true },
                extensions: { value: "", writable: true, configurable: true },
                binaryType: { value: "blob", writable: true, configurable: true },
                send: { value: function() {}, writable: true, configurable: true },
                close: { value: function() { state = 3; }, writable: true, configurable: true },
                addEventListener: { value: target.addEventListener.bind(target), writable: true, configurable: true },
                removeEventListener: { value: target.removeEventListener.bind(target), writable: true, configurable: true },
                dispatchEvent: { value: target.dispatchEvent.bind(target), writable: true, configurable: true }
              });
              setTimeout(function() {
                try {
                  var evt = new Event("open");
                  target.dispatchEvent(evt);
                  if (typeof mock.onopen === "function") mock.onopen(evt);
                } catch (_) {}
              }, 0);
              return mock;
            }

            function PatchedWebSocket(url, protocols) {
              var urlStr = String(url || "");
              var isViteHmr =
                protocols === "vite-hmr" ||
                (Array.isArray(protocols) && protocols.indexOf("vite-hmr") !== -1) ||
                urlStr.indexOf(":24678") !== -1 ||
                (urlStr.indexOf("token=") !== -1 && urlStr.indexOf("/ws/chat") === -1);

              if (isViteHmr) {
                return createMockViteSocket(url, protocols);
              }
              return new RealWS(url, protocols);
            }

            PatchedWebSocket.prototype = RealWS.prototype;
            PatchedWebSocket.CONNECTING = 0;
            PatchedWebSocket.OPEN = 1;
            PatchedWebSocket.CLOSING = 2;
            PatchedWebSocket.CLOSED = 3;
            window.WebSocket = PatchedWebSocket;
          }

          var origError = console.error;
          console.error = function() {
            var msg = Array.prototype.slice.call(arguments).map(function(a) {
              return String(a && a.message ? a.message : a || "");
            }).join(" ");
            if (msg.indexOf("WebSocket closed without opened") !== -1 || msg.indexOf("[vite] failed to connect to websocket") !== -1) {
              return;
            }
            return origError.apply(console, arguments);
          };

          window.addEventListener("unhandledrejection", function(event) {
            if (event && event.reason && String(event.reason.message || event.reason).indexOf("WebSocket closed without opened") !== -1) {
              event.preventDefault();
            }
          });

          window.addEventListener("error", function(event) {
            if (event && (event.message || "").indexOf("WebSocket closed without opened") !== -1) {
              event.preventDefault();
            }
          });
        } catch (_) {}
      })();
    </script>
